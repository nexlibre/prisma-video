name: Android beta
on:
  push:
    branches: [main, beta/5.0.1-consolidation]
    paths-ignore: [README.md, RELEASE.md, LICENSE]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y comprobar
        run: |
          chmod +x gradlew
          mkdir -p build/subtitle-tests
          javac -d build/subtitle-tests app/src/main/java/org/nexlibre/prismavideo/SubtitleTrack.java tests/SubtitleTrackTest.java
          java -cp build/subtitle-tests SubtitleTrackTest
          javac -d build/subtitle-tests app/src/main/java/org/nexlibre/prismavideo/PlaylistOrder.java tests/PlaylistOrderTest.java
          java -cp build/subtitle-tests PlaylistOrderTest
          javac -d build/subtitle-tests app/src/main/java/org/nexlibre/prismavideo/ShuffleOrder.java tests/ShuffleOrderTest.java
          java -cp build/subtitle-tests ShuffleOrderTest
          ./gradlew assembleDebug lintDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Prisma-Video-5.0.1-development.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-Video-5.0.1-development
          path: Prisma-Video-5.0.1-development.apk
      - name: Informes de validación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: app/build/reports/
  playback-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Informes del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-smoke-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
