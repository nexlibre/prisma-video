name: Android beta
on:
  push:
    branches: [main]
    paths-ignore: [README.md, RELEASE.md, LICENSE]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y comprobar
        run: |
          chmod +x gradlew
          mkdir -p build/subtitle-tests
          javac -d build/subtitle-tests app/src/main/java/org/nexlibre/prismavideo/SubtitleTrack.java tests/SubtitleTrackTest.java
          java -cp build/subtitle-tests SubtitleTrackTest
          ./gradlew assembleDebug lintDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Prisma-Video-2.0.0-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-Video-2.0.0-beta
          path: Prisma-Video-2.0.0-beta.apk
      - name: Publicar beta descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.0.0-beta >/dev/null 2>&1; then
            gh release create v2.0.0-beta --target "$GITHUB_SHA" --title 'Prisma Video 2.0.0 beta' --prerelease --notes-file RELEASE.md
          fi
          gh release upload v2.0.0-beta Prisma-Video-2.0.0-beta.apk --clobber
