name: Prisma Video validation and beta
on:
  push:
    branches: [main, beta/5.0.1-consolidation]
    paths-ignore: [README.md, RELEASE.md, LICENSE]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Compilar y comprobar
        run: |
          chmod +x gradlew
          mkdir -p build/subtitle-tests
          javac -d build/subtitle-tests app/src/main/java/org/nexlibre/prismavideo/SubtitleTrack.java tests/SubtitleTrackTest.java
          java -cp build/subtitle-tests SubtitleTrackTest
          javac -d build/subtitle-tests app/src/main/java/org/nexlibre/prismavideo/PlaylistOrder.java tests/PlaylistOrderTest.java
          java -cp build/subtitle-tests PlaylistOrderTest
          javac -d build/subtitle-tests app/src/main/java/org/nexlibre/prismavideo/ShuffleOrder.java tests/ShuffleOrderTest.java
          java -cp build/subtitle-tests ShuffleOrderTest
          ./gradlew assembleDebug lintDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Prisma-Video-5.0.1-beta.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Prisma-Video-5.0.1-beta
          path: Prisma-Video-5.0.1-beta.apk
      - name: Informes de validación
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-reports
          path: app/build/reports/
  playback-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew assembleDebug --no-daemon
            gh release download v2.0.1-beta --repo nexlibre/prisma-video --pattern '*.apk' --dir /tmp/prisma-previous
            export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
            python3 scripts/verify-upgrade.py /tmp/prisma-previous/Prisma-Video-2.0.1-beta.apk app/build/outputs/apk/debug/app-debug.apk
            ./gradlew connectedDebugAndroidTest --no-daemon
            mkdir -p app/build/reports/screenshots
            adb pull /sdcard/Android/data/org.nexlibre.prismavideo/files/screenshots app/build/reports/screenshots
      - name: Informes del emulador
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playback-smoke-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/screenshots/
  publish:
    needs: [build, playback-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Prisma-Video-5.0.1-beta
      - name: Publicar beta verificada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f Prisma-Video-5.0.1-beta.apk
          grep -q "versionName '5.0.1-beta'" app/build.gradle
          sha256sum Prisma-Video-5.0.1-beta.apk > SHA256SUMS
          if gh release view v5.0.1-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'La versión ya existe; no se sobrescriben sus archivos.'
            exit 1
          fi
          gh release create v5.0.1-beta Prisma-Video-5.0.1-beta.apk SHA256SUMS docs/VALIDATION-5.0.1.md --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Prisma Video 5.0.1 beta' --prerelease --notes-file RELEASE.md
